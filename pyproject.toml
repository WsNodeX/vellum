[project]
name = "vellum"
version = "0.1.0"
description = "本地优先的 Markdown 知识库与 BM25 全文检索"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
vellum = "vellum.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vellum*"]
